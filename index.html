<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft 26.3 Survival Prices</title>
<style>
  :root { --bg:#0b0b0b; --panel:#111; --card:#171717; --text:#f2f2f2; --accent:#ff7a00; --accent2:#ffb15c; --line:#3a2a18; --muted:#a08a70; --warn:#ffd23f; }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html { scrollbar-color: var(--accent) var(--bg); scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: var(--bg); border-left: 1px solid var(--line); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:2px solid var(--accent); padding:12px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:18px; margin:0 auto 0 0; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; }
  input[type=text] { height:40px; padding:0 10px; font-size:14px; border:1px solid var(--line); background:#000; color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); }
  button { height:40px; padding:0 18px; font-size:14px; border:2px solid var(--accent); background:var(--accent); color:#000; font-weight:bold; cursor:pointer; text-transform:uppercase; }
  button:hover { background:#000; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #status { width:100%; font-size:13px; color:var(--muted); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:16px; }
  .card { background:var(--card); padding:10px; text-align:center; border:2px solid var(--line); }
  .card:hover { border-color:var(--accent); }
  .card.dirty { border-color:var(--warn); }
  .ico { width:48px; height:48px; margin:0 auto; image-rendering:pixelated; display:block; }
  .ph { width:48px; height:48px; margin:0 auto; background:#2a2a2a; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:20px; color:var(--accent); }
  .card .name { font-size:13px; margin:6px 0; min-height:32px; }
  .card input { width:100%; text-align:center; }
</style>
</head>

const TEX = "https://raw.githubusercontent.com/misode/mcmeta/26.3-assets/assets/minecraft/textures/";
const API = "https://api.jsonbin.io/v3/b";
// นี่คือ Access Key (ต้องมีสิทธิ์ create, read, update) ใครเปิดไฟล์ก็เห็น key นี้
const JSONBIN_KEY = "$2a$10$EXkHeIJC/q2Te/E8MoZHAe3H0Rgl5x/mDjTqhNpIY1eYgsnJLpw8W";
// ใส่ Bin ID ตรงนี้ (ได้จากข้อความสถานะหลัง Save ครั้งแรก) แล้วทุกเครื่องที่เปิดไฟล์นี้จะโหลดราคาให้เอง
const BIN_ID = "6adc9639ffd5d16053881c70";

let prices = {};            // ราคาล่าสุดที่เห็น (local + remote)
let dirty = new Set();      // รายการที่แก้แต่ยังไม่ได้ Save
const urlBin = new URLSearchParams(location.search).get("bin");
let blobId = urlBin || BIN_ID || localStorage.getItem("mcBinId") || "";
if (urlBin) { try { localStorage.setItem("mcBinId", urlBin); } catch (e) {} }

const $ = id => document.getElementById(id);
const setStatus = t => $("status").textContent = t;
const inputs = {};          // id -> <input>

function render() {
  const q = $("search").value.toLowerCase();
  const grid = $("grid"); grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const k in inputs) delete inputs[k];
  ITEMS.forEach(([id, name, tex, isB]) => {
    if (q && !(name.toLowerCase().includes(q) || id.includes(q))) return;
    const d = document.createElement("div");
    d.className = "card" + (dirty.has(id) ? " dirty" : "");
    d.id = "c_" + id;
    const path = tex || ("item/" + id);
    const img = document.createElement("img");
    img.className = "ico"; img.loading = "lazy"; img.alt = "";
    img.src = TEX + path + ".png";
    img.onerror = () => { const p = document.createElement("div"); p.className = "ph"; p.textContent = name[0]; img.replaceWith(p); };
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = name;
    const inp = document.createElement("input");
    inp.type = "text"; inp.inputMode = "decimal"; inp.autocomplete = "off"; inp.placeholder = "ราคา";
    inp.value = prices[id] ?? "";
    inp.addEventListener("input", () => {
      let v = inp.value.replace(",", ".").replace(/[^0-9.]/g, "");
      const i = v.indexOf("."); if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "");
      if (v !== inp.value) inp.value = v;
      if (v === "" || v === ".") delete prices[id]; else prices[id] = Number(v);
      dirty.add(id); d.classList.add("dirty");
    });
    inputs[id] = inp;
    d.append(img, nm, inp);
    frag.appendChild(d);
  });
  grid.appendChild(frag);
}

async function fetchRemote() {
  const r = await fetch(`${API}/${blobId}/latest`, { cache: "no-store", headers: { "X-Access-Key": JSONBIN_KEY, "X-Bin-Meta": "false" } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const text = await r.text();
  const rec = JSON.parse(text);
  return { text, data: rec.prices || {} };
}

async function save() {
  const btn = $("saveBtn"); btn.disabled = true; setStatus("กำลังบันทึก...");
  try {
    let merged = { ...prices };
    if (blobId) {                       // ดึงล่าสุดก่อน แล้วใส่เฉพาะที่เราแก้ เพื่อไม่ทับของคนอื่น
      const { data } = await fetchRemote();
      merged = { ...data };
      dirty.forEach(id => { if (prices[id] === undefined) delete merged[id]; else merged[id] = prices[id]; });
    }
    const body = JSON.stringify({ version: "26.3", prices: merged });
    const headers = { "Content-Type": "application/json", "X-Access-Key": JSONBIN_KEY };
    let res;
    if (blobId) res = await fetch(`${API}/${blobId}`, { method: "PUT", headers, body });
    else {
      res = await fetch(API, { method: "POST", headers: { ...headers, "X-Bin-Private": "true", "X-Bin-Name": "minecraft-prices-26.3" }, body });
      if (res.ok) {
        const j = await res.json();
        blobId = j.metadata && j.metadata.id;
        if (blobId) { localStorage.setItem("mcBinId", blobId); }
      }
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    if (!blobId) throw new Error("บันทึกแล้วแต่อ่าน Bin ID ไม่ได้");
    dirty.clear(); document.querySelectorAll(".dirty").forEach(e => e.classList.remove("dirty"));
    prices = merged;
    render();
    setStatus(`บันทึกแล้ว (${Object.keys(prices).length} รายการ) | Bin ID: ${blobId}`);
  } catch (e) { setStatus("บันทึกไม่สำเร็จ: " + e.message); }
  btn.disabled = false;
}

async function init() {
  if (blobId) { try { const { data } = await fetchRemote(); prices = data; } catch (e) { setStatus("โหลดราคาเดิมไม่สำเร็จ: " + e.message); } }
  render();
    if (!$("status").textContent.includes("ไม่สำเร็จ")) setStatus(`ไอเท็ม Survival ทั้งหมด ${ITEMS.length} รายการ` + (blobId ? ` | Bin ID: ${blobId}` : " | ยังไม่ได้ Save"));
}

$("search").addEventListener("input", render);
$("saveBtn").addEventListener("click", save);
init();
</script>
